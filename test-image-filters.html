<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Sistema de Filtros de Imágenes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .filter-controls {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .filter-group label {
            font-weight: bold;
            color: #ccc;
        }
        
        .filter-select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #333;
            color: white;
        }
        
        .type-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .type-btn {
            padding: 10px 20px;
            border: 1px solid #555;
            background: #333;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .type-btn.active {
            background: #007bff;
            border-color: #007bff;
        }
        
        .type-btn:hover {
            background: #0056b3;
        }
        
        .apartment-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .apartment-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .apartment-card:hover {
            transform: translateY(-5px);
        }
        
        .apartment-image {
            height: 200px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .apartment-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .apartment-info {
            padding: 15px;
        }
        
        .apartment-info h3 {
            margin: 0 0 10px 0;
            color: #fff;
        }
        
        .apartment-info p {
            margin: 5px 0;
            color: #ccc;
        }
        
        .btn-primary {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        
        .btn-primary:hover {
            background: #0056b3;
        }
        
        .apartment-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .apartment-actions .btn-primary,
        .apartment-actions .btn-secondary {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }
        
        .apartment-actions .btn-primary {
            background: #007bff;
            color: white;
        }
        
        .apartment-actions .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }
        
        .apartment-actions .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .apartment-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }
        
        .apartment-actions svg {
            width: 16px;
            height: 16px;
        }
        
        .status {
            background: rgba(0, 123, 255, 0.1);
            border: 1px solid rgba(0, 123, 255, 0.3);
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
        }
        
        .logs {
            background: #000;
            border-radius: 5px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #ccc;
        }
        
        .no-results svg {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        
        /* Modales */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }
        
        .modal {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: hidden;
            animation: slideInUp 0.3s ease;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .modal-header h3 {
            margin: 0;
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #ccc;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            max-height: 70vh;
        }
        
        /* Modal de Video */
        .video-modal {
            width: 800px;
        }
        
        .video-container {
            width: 100%;
            margin-bottom: 1.5rem;
        }
        
        .video-container video {
            width: 100%;
            border-radius: 10px;
            background: #000;
        }
        
        .video-info {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .video-info h4 {
            margin: 0 0 0.5rem 0;
            color: white;
            font-size: 1.2rem;
        }
        
        .video-info p {
            margin: 0.25rem 0;
            color: #ccc;
        }
        
        /* Modal de Contacto */
        .contact-modal {
            width: 600px;
        }
        
        .apartment-summary {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 1.5rem;
        }
        
        .apartment-summary h4 {
            margin: 0 0 0.5rem 0;
            color: white;
            font-size: 1.2rem;
        }
        
        .apartment-summary p {
            margin: 0.25rem 0;
            color: #ccc;
        }
        
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .form-group input,
        .form-group textarea {
            padding: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .form-actions .btn-primary,
        .form-actions .btn-secondary {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }
        
        .form-actions .btn-primary {
            background: #007bff;
            color: white;
        }
        
        .form-actions .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }
        
        .form-actions .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .form-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }
        
        /* Mensaje de éxito */
        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
            z-index: 10001;
            animation: slideInRight 0.3s ease;
        }
        
        .success-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .success-content svg {
            color: white;
        }
        
        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test - Sistema de Filtros de Imágenes</h1>
        
        <div class="status" id="status">
            Estado: Inicializando...
        </div>
        
        <div class="test-section">
            <h2>🎛️ Controles de Filtros</h2>
            
            <div class="type-buttons">
                <button class="type-btn active" data-type="all">Todos</button>
                <button class="type-btn" data-type="1_dormitorio">1 Dormitorio</button>
                <button class="type-btn" data-type="2_dormitorios">2 Dormitorios</button>
                <button class="type-btn" data-type="3_dormitorios">3 Dormitorios</button>
            </div>
            
            <div class="filter-controls">
                <div class="filter-group">
                    <label>Superficie:</label>
                    <select class="filter-select" id="surfaceFilter">
                        <option value="">Todas</option>
                        <option value="40-60">40-60 m²</option>
                        <option value="60-80">60-80 m²</option>
                        <option value="80-100">80-100 m²</option>
                        <option value="100+">100+ m²</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Precio:</label>
                    <select class="filter-select" id="priceFilter">
                        <option value="">Todos</option>
                        <option value="2000-3000">$2.000-3.000 UF</option>
                        <option value="3000-4000">$3.000-4.000 UF</option>
                        <option value="4000-5000">$4.000-5.000 UF</option>
                        <option value="5000+">$5.000+ UF</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button class="btn-primary" id="searchButton">🔍 Buscar</button>
                </div>
                
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button class="btn-primary" id="clearFilters" style="background: #6c757d;">🧹 Limpiar</button>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>🏠 Lista de Apartamentos</h2>
            <div id="apartmentList" class="apartment-list">
                <div class="no-results">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"></circle>
                        <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <h3>Presiona "Buscar" para ver los apartamentos</h3>
                    <p>Selecciona los filtros y presiona el botón de búsqueda</p>
                </div>
            </div>
        </div>
        
        <div class="logs" id="logs">
            <div>📋 Logs del sistema...</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/ImageFilterSystem.js"></script>
    <script>
        function updateStatus(message) {
            document.getElementById('status').textContent = `Estado: ${message}`;
        }
        
        function addLog(message) {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            logs.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }
        
        // Interceptar console.log para mostrar en la UI
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog(args.join(' '));
        };
        
        document.addEventListener('DOMContentLoaded', () => {
            updateStatus('Iniciando sistema...');
            addLog('🚀 Iniciando test del sistema de filtros de imágenes...');
            
            try {
                // Crear instancia del ImageFilterSystem
                window.imageFilterSystem = new ImageFilterSystem();
                updateStatus('Sistema inicializado correctamente');
                addLog('✅ ImageFilterSystem inicializado');
                
                // Mostrar información inicial
                setTimeout(() => {
                    const totalImages = window.imageFilterSystem.getAvailableImageCount();
                    addLog(`📊 Total de imágenes disponibles: ${totalImages}`);
                    updateStatus(`Listo - ${totalImages} imágenes disponibles`);
                }, 1000);
                
            } catch (error) {
                updateStatus(`Error: ${error.message}`);
                addLog(`❌ Error: ${error.message}`);
                console.error('Error inicializando sistema:', error);
            }
        });
    </script>
</body>
</html>
