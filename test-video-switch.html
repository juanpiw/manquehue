<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Video Switch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .test-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .selector {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .radio-option {
            display: inline-block;
            margin-right: 20px;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .radio-option:hover {
            background: rgba(255,255,255,0.2);
        }
        .radio-option.selected {
            background: rgba(0,123,255,0.3);
        }
        .radio-circle {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        .radio-inner {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            margin: 2px;
        }
        .video-display {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .video-display video {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 5px;
        }
        .logs {
            margin: 20px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .log-info { background: rgba(0,123,255,0.2); }
        .log-success { background: rgba(0,255,0,0.2); }
        .log-warning { background: rgba(255,193,7,0.2); }
        .log-error { background: rgba(220,53,69,0.2); }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Test Video Switch System</h1>
        <p>Probando el cambio de videos entre Apartamento y Casa</p>
        
        <div class="selector">
            <h3>Selector de Proyecto:</h3>
            <div class="radio-option selected">
                <div class="radio-circle">
                    <div class="radio-inner"></div>
                </div>
                <span class="radio-label">Apartamento</span>
            </div>
            <div class="radio-option">
                <div class="radio-circle"></div>
                <span class="radio-label">Casa</span>
            </div>
        </div>
        
        <div class="video-display">
            <h3>Video Actual:</h3>
            <video id="backgroundVideo" autoplay muted loop>
                <source src="video/apartamento/video-0.mp4" type="video/mp4">
                Tu navegador no soporta el elemento video.
            </video>
            <div id="videoInfo">Cargando...</div>
        </div>
        
        <div class="logs">
            <h3>Logs del Sistema:</h3>
            <div id="logs"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/VideoScrollSystem.js"></script>
    <script src="js/ContentManager.js"></script>
    <script>
        // Función para agregar logs
        function addLog(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        // Función para actualizar información del video
        function updateVideoInfo() {
            const video = document.getElementById('backgroundVideo');
            const infoDiv = document.getElementById('videoInfo');
            
            if (video.src) {
                const src = video.src;
                const filename = src.split('/').pop();
                infoDiv.textContent = `Video actual: ${filename}`;
                addLog(`Video cargado: ${filename}`, 'success');
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', async () => {
            addLog('🚀 Inicializando sistema de prueba...', 'info');
            
            try {
                // Crear instancia del VideoScrollSystem
                window.videoScrollApp = {
                    videoSystem: new VideoScrollSystem()
                };
                
                addLog('✅ VideoScrollSystem creado', 'success');
                
                // Crear instancia del ContentManager
                window.contentManager = new ContentManager();
                
                addLog('✅ ContentManager creado', 'success');
                
                // Esperar a que se inicialice el ContentManager
                await new Promise(resolve => {
                    const checkInit = () => {
                        if (window.contentManager.isInitialized) {
                            resolve();
                        } else {
                            setTimeout(checkInit, 100);
                        }
                    };
                    checkInit();
                });
                
                addLog('✅ ContentManager inicializado', 'success');
                
                // Configurar event listeners para el selector
                const radioOptions = document.querySelectorAll('.radio-option');
                radioOptions.forEach(option => {
                    option.addEventListener('click', (e) => {
                        // Remover selección anterior
                        radioOptions.forEach(opt => opt.classList.remove('selected'));
                        radioOptions.forEach(opt => {
                            const circle = opt.querySelector('.radio-circle');
                            if (circle) circle.innerHTML = '';
                        });
                        
                        // Seleccionar actual
                        option.classList.add('selected');
                        const circle = option.querySelector('.radio-circle');
                        if (circle) circle.innerHTML = '<div class="radio-inner"></div>';
                        
                        const label = option.querySelector('.radio-label').textContent.toLowerCase();
                        addLog(`🎯 Cambiando a: ${label}`, 'info');
                        
                        window.contentManager.switchProjectType(label).then(() => {
                            addLog(`✅ Cambio completado a: ${label}`, 'success');
                            updateVideoInfo();
                        }).catch(error => {
                            addLog(`❌ Error en cambio: ${error.message}`, 'error');
                        });
                    });
                });
                
                // Configurar listener para cambios de video
                const video = document.getElementById('backgroundVideo');
                video.addEventListener('loadstart', () => {
                    addLog('🚀 Iniciando carga de video', 'info');
                });
                
                video.addEventListener('loadeddata', () => {
                    addLog('✅ Video cargado correctamente', 'success');
                    updateVideoInfo();
                });
                
                video.addEventListener('error', (e) => {
                    addLog(`❌ Error al cargar video: ${e.message}`, 'error');
                });
                
                // Actualizar información inicial
                updateVideoInfo();
                
                addLog('🎉 Sistema de prueba configurado correctamente', 'success');
                
            } catch (error) {
                addLog(`❌ Error en inicialización: ${error.message}`, 'error');
                console.error('Error en test:', error);
            }
        });
    </script>
</body>
</html>
