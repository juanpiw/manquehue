<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Content Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .selector {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .radio-option {
            display: inline-block;
            margin-right: 20px;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .radio-option:hover {
            background: rgba(255,255,255,0.2);
        }
        .radio-option.selected {
            background: rgba(0,123,255,0.3);
        }
        .radio-circle {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        .radio-inner {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            margin: 2px;
        }
        .content {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .hero-title {
            font-size: 2em;
            margin-bottom: 1rem;
            color: white;
        }
        .description-text {
            font-size: 1.1em;
            line-height: 1.6;
            color: white;
            margin-bottom: 1rem;
        }
        .logs {
            margin: 20px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .log-info { background: rgba(0,123,255,0.2); }
        .log-success { background: rgba(0,255,0,0.2); }
        .log-warning { background: rgba(255,193,7,0.2); }
        .log-error { background: rgba(220,53,69,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Content Simple</h1>
        <p>Prueba muy simple del ContentManager sin interferencias</p>
        
        <div class="selector">
            <h3>Selector:</h3>
            <div class="radio-option selected">
                <div class="radio-circle">
                    <div class="radio-inner"></div>
                </div>
                <span class="radio-label">Apartamento</span>
            </div>
            <div class="radio-option">
                <div class="radio-circle"></div>
                <span class="radio-label">Casa</span>
            </div>
        </div>
        
        <div class="content">
            <h1 class="hero-title">Mirador del Golf</h1>
            <p class="description-text">
                Exclusivas casas y departamentos ubicados en el sector más privilegiado de Piedra Roja...
            </p>
        </div>
        
        <div class="logs">
            <h3>Logs:</h3>
            <div id="logs"></div>
        </div>
    </div>

    <!-- Solo ContentManager -->
    <script src="js/ContentManager.js"></script>
    <script>
        function addLog(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function showContent() {
            const title = document.querySelector('.hero-title');
            const description = document.querySelector('.description-text');
            
            addLog(`📝 Título: "${title.textContent}"`, 'info');
            addLog(`📝 Descripción: "${description.textContent.substring(0, 100)}..."`, 'info');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            addLog('🚀 Iniciando prueba simple...', 'info');
            
            try {
                // Crear ContentManager
                window.contentManager = new ContentManager();
                addLog('✅ ContentManager creado', 'success');
                
                // Esperar inicialización
                await new Promise(resolve => {
                    const checkInit = () => {
                        if (window.contentManager.isInitialized) {
                            resolve();
                        } else {
                            setTimeout(checkInit, 100);
                        }
                    };
                    checkInit();
                });
                
                addLog('✅ ContentManager inicializado', 'success');
                showContent();
                
                // Event listeners
                const radioOptions = document.querySelectorAll('.radio-option');
                radioOptions.forEach(option => {
                    option.addEventListener('click', (e) => {
                        // UI
                        radioOptions.forEach(opt => opt.classList.remove('selected'));
                        radioOptions.forEach(opt => {
                            const circle = opt.querySelector('.radio-circle');
                            if (circle) circle.innerHTML = '';
                        });
                        
                        option.classList.add('selected');
                        const circle = option.querySelector('.radio-circle');
                        if (circle) circle.innerHTML = '<div class="radio-inner"></div>';
                        
                        // Cambio de contenido
                        const label = option.querySelector('.radio-label').textContent.toLowerCase();
                        addLog(`🎯 Cambiando a: ${label}`, 'info');
                        
                        window.contentManager.switchProjectType(label).then(() => {
                            addLog(`✅ Cambio completado a: ${label}`, 'success');
                            setTimeout(() => {
                                showContent();
                            }, 500);
                        }).catch(error => {
                            addLog(`❌ Error: ${error.message}`, 'error');
                        });
                    });
                });
                
                addLog('🎉 Prueba configurada', 'success');
                
            } catch (error) {
                addLog(`❌ Error: ${error.message}`, 'error');
            }
        });
    </script>
</body>
</html>
