<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="400" height="300" fill="#f5f5f5"/>
  
  <!-- Casa -->
  <g transform="translate(150, 100)">
    <!-- Techo -->
    <polygon points="0,0 50,-30 100,0" fill="#8B4513" stroke="#654321" stroke-width="2"/>
    
    <!-- Paredes -->
    <rect x="10" y="0" width="80" height="60" fill="#DEB887" stroke="#8B4513" stroke-width="2"/>
    
    <!-- Puerta -->
    <rect x="35" y="20" width="20" height="40" fill="#8B4513" stroke="#654321" stroke-width="1"/>
    
    <!-- Ventanas -->
    <rect x="15" y="15" width="15" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
    <rect x="70" y="15" width="15" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
    
    <!-- Chimenea -->
    <rect x="60" y="-25" width="8" height="25" fill="#A0522D" stroke="#8B4513" stroke-width="1"/>
  </g>
  
  <!-- Texto -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle">
    Casa Preview
  </text>
  
  <!-- Icono de casa -->
  <g transform="translate(200, 50)">
    <circle cx="0" cy="0" r="20" fill="#4CAF50" opacity="0.1"/>
    <path d="M-10,-5 L0,-15 L10,-5 L10,5 L-10,5 Z" fill="#4CAF50" opacity="0.3"/>
  </g>
</svg>
