<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Final - ContentManager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .selector {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .radio-option {
            display: inline-block;
            margin-right: 20px;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .radio-option:hover {
            background: rgba(255,255,255,0.2);
        }
        .radio-option.selected {
            background: rgba(0,123,255,0.3);
        }
        .radio-circle {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        .radio-inner {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            margin: 2px;
        }
        .content {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .hero-title {
            font-size: 2em;
            margin-bottom: 1rem;
            color: white;
        }
        .description-text {
            font-size: 1.1em;
            line-height: 1.6;
            color: white;
            margin-bottom: 1rem;
        }
        .status {
            margin: 20px 0;
            padding: 10px;
            background: rgba(0,255,0,0.1);
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Final - ContentManager</h1>
        <p>Prueba final del ContentManager</p>
        
        <div class="status" id="status">
            Estado: Inicializando...
        </div>
        
        <div class="selector">
            <h3>Selector:</h3>
            <div class="radio-option selected">
                <div class="radio-circle">
                    <div class="radio-inner"></div>
                </div>
                <span class="radio-label">Apartamento</span>
            </div>
            <div class="radio-option">
                <div class="radio-circle"></div>
                <span class="radio-label">Casa</span>
            </div>
        </div>
        
        <div class="content">
            <h1 class="hero-title">Mirador del Golf</h1>
            <p class="description-text">
                Exclusivas casas y departamentos ubicados en el sector más privilegiado de Piedra Roja...
            </p>
        </div>
    </div>

    <!-- Solo ContentManager -->
    <script src="js/ContentManager.js"></script>
    <script>
        function updateStatus(message) {
            document.getElementById('status').textContent = `Estado: ${message}`;
        }

        function showContent() {
            const title = document.querySelector('.hero-title');
            const description = document.querySelector('.description-text');
            
            console.log(`📝 Título: "${title.textContent}"`);
            console.log(`📝 Descripción: "${description.textContent.substring(0, 100)}..."`);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            updateStatus('Iniciando...');
            
            try {
                // Crear ContentManager
                window.contentManager = new ContentManager();
                updateStatus('ContentManager creado');
                
                // Esperar inicialización
                await new Promise(resolve => {
                    const checkInit = () => {
                        if (window.contentManager.isInitialized) {
                            resolve();
                        } else {
                            setTimeout(checkInit, 100);
                        }
                    };
                    checkInit();
                });
                
                updateStatus('ContentManager inicializado');
                showContent();
                
                // Event listeners
                const radioOptions = document.querySelectorAll('.radio-option');
                radioOptions.forEach(option => {
                    option.addEventListener('click', (e) => {
                        // UI
                        radioOptions.forEach(opt => opt.classList.remove('selected'));
                        radioOptions.forEach(opt => {
                            const circle = opt.querySelector('.radio-circle');
                            if (circle) circle.innerHTML = '';
                        });
                        
                        option.classList.add('selected');
                        const circle = option.querySelector('.radio-circle');
                        if (circle) circle.innerHTML = '<div class="radio-inner"></div>';
                        
                        // Cambio de contenido
                        const label = option.querySelector('.radio-label').textContent.toLowerCase();
                        updateStatus(`Cambiando a: ${label}`);
                        
                        window.contentManager.switchProjectType(label).then(() => {
                            updateStatus(`Cambio completado a: ${label}`);
                            setTimeout(() => {
                                showContent();
                            }, 500);
                        }).catch(error => {
                            updateStatus(`Error: ${error.message}`);
                        });
                    });
                });
                
                updateStatus('Listo para usar');
                
            } catch (error) {
                updateStatus(`Error: ${error.message}`);
            }
        });
    </script>
</body>
</html>
