<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Content System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .selector {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .radio-option {
            display: inline-block;
            margin-right: 20px;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .radio-option:hover {
            background: rgba(255,255,255,0.2);
        }
        .radio-option.selected {
            background: rgba(0,123,255,0.3);
        }
        .content-display {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .video-paths {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Test Content System</h1>
        
        <div class="selector">
            <h3>Selector de Proyecto:</h3>
            <div class="radio-option selected">
                <span class="radio-label">Apartamento</span>
            </div>
            <div class="radio-option">
                <span class="radio-label">Casa</span>
            </div>
        </div>
        
        <div class="content-display">
            <h3>Contenido Actual:</h3>
            <div id="currentTitle">Cargando...</div>
            <div id="currentDescription">Cargando...</div>
            <div id="currentVideos">Cargando videos...</div>
        </div>
        
        <div class="content-display">
            <h3>Logs del Sistema:</h3>
            <div id="logs"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/ContentManager.js"></script>
    <script>
        // Función para agregar logs
        function addLog(message) {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.style.margin = '5px 0';
            logEntry.style.padding = '5px';
            logEntry.style.background = 'rgba(0,0,0,0.3)';
            logEntry.style.borderRadius = '3px';
            logEntry.style.fontSize = '12px';
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
        }

        // Función para actualizar contenido mostrado
        function updateDisplay() {
            if (window.contentManager) {
                const data = window.contentManager.getCurrentData();
                if (data) {
                    document.getElementById('currentTitle').textContent = data.title;
                    document.getElementById('currentDescription').textContent = data.description;
                    
                    const videosDiv = document.getElementById('currentVideos');
                    videosDiv.innerHTML = '';
                    
                    Object.entries(data.videos).forEach(([section, videos]) => {
                        const sectionDiv = document.createElement('div');
                        sectionDiv.className = 'video-paths';
                        sectionDiv.innerHTML = `<strong>${section}:</strong><br>${videos.join('<br>')}`;
                        videosDiv.appendChild(sectionDiv);
                    });
                }
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', async () => {
            addLog('Inicializando ContentManager...');
            
            try {
                // Crear instancia del ContentManager
                window.contentManager = new ContentManager();
                
                // Esperar a que se inicialice
                await new Promise(resolve => {
                    const checkInit = () => {
                        if (window.contentManager.isInitialized) {
                            resolve();
                        } else {
                            setTimeout(checkInit, 100);
                        }
                    };
                    checkInit();
                });
                
                addLog('ContentManager inicializado correctamente');
                
                // Configurar event listeners para el selector
                const radioOptions = document.querySelectorAll('.radio-option');
                radioOptions.forEach(option => {
                    option.addEventListener('click', (e) => {
                        // Remover selección anterior
                        radioOptions.forEach(opt => opt.classList.remove('selected'));
                        
                        // Seleccionar actual
                        option.classList.add('selected');
                        
                        const label = option.querySelector('.radio-label').textContent.toLowerCase();
                        addLog(`Cambiando a: ${label}`);
                        
                        window.contentManager.switchProjectType(label).then(() => {
                            updateDisplay();
                        });
                    });
                });
                
                // Actualizar display inicial
                updateDisplay();
                
                // Configurar listener para cambios de contenido
                window.contentManager.on('projectType:changed', (data) => {
                    addLog(`Proyecto cambiado a: ${data.type}`);
                    updateDisplay();
                });
                
                addLog('Sistema de prueba configurado correctamente');
                
            } catch (error) {
                addLog(`Error: ${error.message}`);
                console.error('Error en test:', error);
            }
        });
    </script>
</body>
</html>
