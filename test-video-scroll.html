<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Video Scroll System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }
        
        .video-background-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
        }
        
        .background-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        
        .content {
            position: relative;
            z-index: 2;
            color: white;
        }
        
        .section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }
        
        .section-1 { background: rgba(0,0,0,0.3); }
        .apartments { background: rgba(0,0,0,0.3); }
        .features { background: rgba(0,0,0,0.3); }
        .equipment { background: rgba(0,0,0,0.3); }
        
        .debug-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <!-- Video Background Container -->
    <div class="video-background-wrapper">
        <video 
            id="backgroundVideo"
            muted
            playsinline
            preload="metadata"
            class="background-video">
        </video>
    </div>

    <!-- Content -->
    <div class="content">
        <section id="section-1" class="section section-1">
            <div>
                <h1>SECCIÓN 1</h1>
                <p>Video: video-0.mp4 o video-5.mp4</p>
            </div>
        </section>
        
        <section id="apartments" class="section apartments">
            <div>
                <h1>APARTAMENTOS</h1>
                <p>Video: video-1.mp4 o video-6.mp4</p>
            </div>
        </section>
        
        <section id="features" class="section features">
            <div>
                <h1>CARACTERÍSTICAS</h1>
                <p>Video: video-3.mp4 o video-7.mp4</p>
            </div>
        </section>
        
        <section id="equipment" class="section equipment">
            <div>
                <h1>EQUIPAMIENTO</h1>
                <p>Video: video-4.mp4 o video-8.mp4</p>
            </div>
        </section>
    </div>

    <!-- Debug Info -->
    <div class="debug-info" id="debugInfo">
        <strong>Video Scroll Debug</strong><br>
        <span id="currentSection">Section: -</span><br>
        <span id="currentVideo">Video: -</span><br>
        <span id="scrollPosition">Scroll: -</span><br>
        <span id="videoStatus">Status: -</span>
    </div>

    <!-- Scripts -->
    <script src="js/VideoScrollSystem.js"></script>
    <script>
        // Inicialización simple
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Starting test...');
            
            const videoSystem = new VideoScrollSystem();
            await videoSystem.init();
            
            // Debug info update
            function updateDebugInfo() {
                const debugInfo = document.getElementById('debugInfo');
                const currentSection = document.getElementById('currentSection');
                const currentVideo = document.getElementById('currentVideo');
                const scrollPosition = document.getElementById('scrollPosition');
                const videoStatus = document.getElementById('videoStatus');
                
                const scrollY = window.scrollY;
                const videoInfo = videoSystem.getCurrentVideoInfo();
                
                currentSection.textContent = `Section: ${videoSystem.getCurrentSection(scrollY)}`;
                currentVideo.textContent = `Video: ${videoInfo.index + 1}`;
                scrollPosition.textContent = `Scroll: ${scrollY}px`;
                videoStatus.textContent = `Status: ${videoInfo.isPlaying ? 'Playing' : 'Paused'}`;
            }
            
            // Update debug info every 500ms
            setInterval(updateDebugInfo, 500);
            
            console.log('✅ Test initialized');
        });
    </script>
</body>
</html>
