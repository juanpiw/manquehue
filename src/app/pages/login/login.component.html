<!-- login.component.html -->

  <div class="row">
    <div class="col-4">

    </div>
    <div class="col-8 col-xs-12">
      <div class="login-container">
        <div class="login-header">
          <h1  >HOLA!</h1>
          <p>Welcome back!</p>
        </div>
      
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="email">Correo</label>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="form-control"
              placeholder="Ingresa tu correo electrónico"
              required
            />
            <div *ngIf="loginForm.get('email')?.touched">
                <small class="text-danger" *ngIf="loginForm.get('email')?.errors?.['required']">
                  El correo es obligatorio.
                </small>
                <small class="text-danger" *ngIf="loginForm.get('email')?.errors?.['email']">
                  Debe ser un correo válido.
                </small>
              </div>
          </div>
      
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              formControlName="password"
              class="form-control"
              placeholder="Ingresa tu contraseña"
              required
            />
            <div *ngIf="loginForm.get('password')?.errors && loginForm.get('password')?.touched">
                <small class="text-danger" *ngIf="loginForm.get('password')?.errors?.['required']">
                  La contraseña es obligatoria.
                </small>
                <small class="text-danger" *ngIf="loginForm.get('password')?.errors?.['minlength']">
                  La contraseña debe tener al menos 6 caracteres.
                </small>
              </div>
          </div>
      
          <button type="submit" class="btn btn-primary" [disabled]="!loginForm.valid">Sign in</button>
        </form>
      
        <div class="login-footer">
          <p>¿No tienes cuenta? <a  routerLink="/registro">Regístrate aquí</a></p>
          <p><a  routerLink="/recuperar">Restablecer contraseña</a></p>
        </div>
      </div>
    </div>
   
  </div>
