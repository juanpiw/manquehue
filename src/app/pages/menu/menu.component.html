<div class="menu" [class.menu--compact]="isCompact">
  <div class="menu__header">
    <div class="menu__lang">
      <app-lang-switcher></app-lang-switcher>
      <button class="menu__toggle" type="button" (click)="toggleCompact()" aria-label="Toggle menu">
        <span></span>
        <span></span>
      </button>
    </div>
    <div class="menu__logo">
      <img
        src="assets/logo1.png"
        alt="Inmobiliaria Manquehue"
        class="menu__logo-img"
        loading="lazy">
    </div>
  </div>

  <nav class="menu__nav custom-scrollbar">
    <button
      type="button"
      class="menu__nav-item"
      *ngFor="let item of mainItems"
      (click)="handleItemClick(item)"
      [class.menu__nav-item--active]="isActive(item.component)">
      <span class="menu__indicator" *ngIf="isActive(item.component)"></span>
      <span class="menu__icon">
        <lucide-icon [name]="item.icon"></lucide-icon>
      </span>
      <span class="menu__label">{{ item.labelKey | t }}</span>
    </button>
  </nav>

  <footer class="menu__footer">
    <div class="menu__footer-title">{{ 'menu.soporte_ayuda' | t }}</div>
    <button
      type="button"
      class="menu__nav-item menu__nav-item--muted"
      *ngFor="let item of footerItems"
      (click)="handleItemClick(item)"
      [class.menu__nav-item--active]="isActive(item.component)">
      <span class="menu__icon">
        <lucide-icon [name]="item.icon"></lucide-icon>
      </span>
      <span class="menu__label">{{ item.labelKey | t }}</span>
      <span class="menu__badge" *ngIf="item.id === 'soporte'"></span>
    </button>
    <button
      type="button"
      class="menu__nav-item menu__nav-item--logout"
      (click)="logout()">
      <span class="menu__icon">
        <lucide-icon name="log-out"></lucide-icon>
      </span>
      <span class="menu__label">{{ 'menu.cerrar_sesion' | t }}</span>
    </button>
  </footer>
</div>
