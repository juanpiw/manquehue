<div class="location-tag" [class]="'size-' + config.size">
  <!-- Icono de ubicación -->
  <div class="location-icon" *ngIf="config.showIcon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path 
        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zM12 11.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" 
        fill="currentColor"
        stroke="currentColor"
        stroke-width="0.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>
  </div>
  
  <!-- Texto de ubicación -->
  <span class="location-text">{{ locationText }}</span>
</div>
