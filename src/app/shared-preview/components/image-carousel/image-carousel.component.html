<div class="image-carousel">
  <!-- Navigation Arrows -->
  

  <!-- Main Image Display -->
  <div class="main-image-container">
    <div class="main-image" (click)="onMainImageClick()">
      <img 
        *ngIf="getActiveImage()?.src" 
        [src]="getActiveImage()?.src" 
        [alt]="getActiveImage()?.alt"
        class="active-image">
      
      <!-- Placeholder when no image -->
      <div class="image-placeholder" *ngIf="!getActiveImage()?.src">
        <svg width="80" height="60" viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Mountain landscape icon -->
          <path d="M10 45L25 30L40 40L55 25L70 35V45H10Z" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
          <circle cx="65" cy="15" r="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
          <path d="M15 45L20 40L25 42L30 38L35 40L40 35L45 37L50 32L55 34L60 30L65 32L70 28V45H15Z" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.5"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Image Preview Thumbnails with side arrows -->
  <div class="thumbnails-row" *ngIf="config.showPreviewThumbnails">
    <button class="thumb-nav thumb-prev" (click)="onPrevious()" aria-label="Anterior">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="preview-thumbnails">
      <div 
        *ngFor="let image of config.images; let i = index"
        class="thumbnail-item"
        [class.active]="image.active"
        (click)="onImageClick(image.id)">
        
        <img 
          *ngIf="image.src" 
          [src]="image.src" 
          [alt]="image.alt"
          class="thumbnail-image">
        
        <!-- Thumbnail placeholder -->
        <div class="thumbnail-placeholder" *ngIf="!image.src">
          <svg width="40" height="30" viewBox="0 0 40 30" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 22.5L12.5 15L20 17.5L27.5 12.5L35 17.5V22.5H5Z" fill="#e5e7eb" stroke="#d1d5db" stroke-width="0.5"/>
            <circle cx="32.5" cy="7.5" r="4" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5"/>
            <path d="M7.5 22.5L10 20L12.5 21L15 19L17.5 20L20 17.5L22.5 18.5L25 16L27.5 17L30 15L32.5 16V22.5H7.5Z" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.25"/>
          </svg>
        </div>
      </div>
    </div>

    <button class="thumb-nav thumb-next" (click)="onNext()" aria-label="Siguiente">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>
