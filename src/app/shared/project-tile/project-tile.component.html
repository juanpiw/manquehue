<div class="tile" [style.--size.px]="iconSize">
  <!-- Ícono carpeta (doble trazo con SVG) -->
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <!-- trazo exterior -->
    <path class="folder outer"
      d="M3.5 8.5c0-1.1.9-2 2-2h4.1c.5 0 1 .2 1.3.6l.8 1c.3.3.7.4 1.1.4H18.5c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2H5.5c-1.1 0-2-.9-2-2v-10z"/>
    <!-- trazo interior (ligeramente reducido) -->
    <path class="folder inner"
      d="M4.7 9.3c0-.8.7-1.5 1.5-1.5h4c.4 0 .8.2 1.1.5l.7.8c.3.3.7.5 1.1.5h5.3c.8 0 1.5.7 1.5 1.5v7c0 .8-.7 1.5-1.5 1.5H6.2c-.8 0-1.5-.7-1.5-1.5v-8.8z"/>
  </svg>

  <span class="label text-body text-medium">{{ label }}</span>
</div>
